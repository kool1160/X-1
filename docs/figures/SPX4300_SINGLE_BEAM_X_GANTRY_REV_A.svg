  <rect x="170" y="225" width="960" height="18" class="rail"/>
  <rect x="170" y="355" width="960" height="18" class="rail"/>
  <text x="1185" y="237" class="small">Upper profile rail</text>
  <text x="1185" y="369" class="small">Lower profile rail</text>
  <rect x="560" y="205" width="85" height="55" rx="6" class="block"/>
  <rect x="685" y="205" width="85" height="55" rx="6" class="block"/>
  <rect x="560" y="338" width="85" height="55" rx="6" class="block"/>
  <rect x="685" y="338" width="85" height="55" rx="6" class="block"/>
  <rect x="525" y="175" width="280" height="280" rx="4" class="plate"/>
  <text x="585" y="300" class="label">1/4-inch</text>
  <text x="565" y="325" class="label">X carriage plate</text>
  <rect x="625" y="430" width="80" height="180" class="plate"/>
  <text x="720" y="530" class="label">Current Z on adapter plate</text>
  <line x1="705" y1="520" x2="900" y2="520" class="call"/>
  <rect x="590" y="610" width="150" height="28" rx="4" class="plate"/>
  <text x="760" y="633" class="label">Torch holder / future breakaway</text>

  <rect x="155" y="400" width="990" height="24" class="rack"/>
  <path d="M165 424 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14 l10 14 l10 -14" fill="none" stroke="#111" stroke-width="2"/>
  <text x="1185" y="420" class="small">Existing rack on removable carrier, teeth down</text>
  <circle cx="820" cy="438" r="34" fill="#bbb" stroke="#111" stroke-width="3"/>
  <circle cx="820" cy="438" r="7" fill="#333"/>
  <rect x="825" y="470" width="105" height="105" rx="8" class="motor"/>
