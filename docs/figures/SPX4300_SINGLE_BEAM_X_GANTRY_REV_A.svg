<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <style>
    .title{font:700 34px Arial,sans-serif}.sub{font:20px Arial,sans-serif}.label{font:18px Arial,sans-serif}.small{font:15px Arial,sans-serif}.beam{fill:#d9dde3;stroke:#111;stroke-width:4}.rail{fill:#555;stroke:#111;stroke-width:2}.block{fill:#9aa4b2;stroke:#111;stroke-width:2}.plate{fill:#e8edf5;stroke:#111;stroke-width:3}.rack{fill:#333;stroke:#111;stroke-width:2}.motor{fill:#c9d7e8;stroke:#111;stroke-width:3}.dim{stroke:#111;stroke-width:2;marker-start:url(#a);marker-end:url(#a)}.dash{stroke:#555;stroke-width:2;stroke-dasharray:8 7;fill:none}.call{stroke:#222;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111"/></marker></defs>
  <text x="55" y="55" class="title">SPX4300 4×8 — Single-Beam X Gantry Rev A</text>
  <text x="55" y="88" class="sub">Provisional architecture — physical measurements and exact purchased rail drawings required before DXF release</text>

  <text x="55" y="145" class="sub">Front view</text>
  <rect x="120" y="190" width="1060" height="220" rx="5" class="beam"/>
