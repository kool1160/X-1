  <text x="935" y="541" class="small">on spring-loaded pivot plate</text>

  <rect x="65" y="180" width="45" height="250" class="plate"/>
  <rect x="1190" y="180" width="45" height="250" class="plate"/>
  <text x="32" y="465" class="small">Slotted end plate</text>
  <text x="1178" y="465" class="small">Slotted end plate</text>
  <line x1="85" y1="455" x2="85" y2="420" class="call"/>
  <line x1="1208" y1="455" x2="1208" y2="420" class="call"/>
  <line x1="120" y1="155" x2="1180" y2="155" class="dim"/>
  <text x="540" y="140" class="label">Reference beam length ≈ 62.82 in — verify physical mounting span</text>
  <line x1="90" y1="190" x2="90" y2="410" class="dim"/>
  <text x="15" y="310" class="label" transform="rotate(-90 15 310)">6.00 in nominal</text>

  <text x="55" y="715" class="sub">Side section</text>
  <rect x="150" y="755" width="250" height="110" class="beam"/>
  <rect x="130" y="772" width="18" height="18" class="rail"/>
  <rect x="130" y="830" width="18" height="18" class="rail"/>
  <rect x="90" y="750" width="38" height="120" class="plate"/>
  <rect x="205" y="865" width="150" height="18" class="rack"/>
  <circle cx="185" cy="875" r="28" fill="#bbb" stroke="#111" stroke-width="3"/>
  <rect x="90" y="700" width="95" height="48" class="motor"/>
  <path d="M138 748 Q150 790 185 847" class="dash"/>
  <text x="445" y="785" class="label">Two rail foundation bars aligned independently</text>
  <line x1="440" y1="790" x2="150" y2="780" class="call"/>
  <text x="445" y="825" class="label">Rack carrier bolts to beam; rack is not sacrificed</text>
  <line x1="440" y1="830" x2="355" y2="872" class="call"/>
  <text x="445" y="865" class="label">Pivot stop sets mesh; spring only maintains contact</text>
  <line x1="440" y1="870" x2="185" y2="875" class="call"/>

  <text x="950" y="730" class="sub">Fabrication boundary</text>
  <text x="950" y="770" class="label">In-house:</text>
  <text x="1030" y="770" class="label">tube, laser-cut plates, formed rack carrier, TIG welding, drilling/tapping</text>
  <text x="950" y="810" class="label">Purchased:</text>
  <text x="1045" y="810" class="label">profile rails/blocks, shoulder bolt, bushings/bearings, springs, hardware</text>
  <text x="950" y="850" class="label">Reused:</text>
  <text x="1025" y="850" class="label">rack, pinion, motor, cable chain, limit switch, current Z</text>
</svg>